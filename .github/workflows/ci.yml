name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支/PR 的旧运行自动取消，节省 runner 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_OPTS: -Xmx3g -Dmaven.artifact.threads=8

jobs:
  # ==========================================================
  # 变更检测：backend / frontend 路径过滤，避免无关变更全量构建
  # ==========================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'pom.xml'
              - 'lombok.config'
              - 'mvnw'
              - '.mvn/**'
              - 'seahorse-agent-*/**'
              - 'resources/**'
              - 'scripts/**'
              - 'complexity-baseline.txt'
              - 'docs/design/architecture-complexity-reduction-plan.md'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  # ==========================================================
  # 后端：编译 + 单元测试（32 个 Maven 模块）
  # ==========================================================
  backend:
    name: Backend · Maven build & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, unit, and architecture tests
        # 说明：
        # - 根 pom 的 surefire 已排除 @Tag("integration")
        # - seahorse-agent-tests 里的 e2e 包（SeahorseE2E*）是 @SpringBootTest
        #   直连 localhost:9090 的真实环境测试，未打 integration 标签，
        #   在无 full-Docker 环境的 runner 上必挂，这里显式排除。
        #   后续建议给它们补上 @Tag("integration")，然后删掉本处 -Dtest 参数。
        run: >
          ./mvnw -B -ntp verify
          -Dtest='!SeahorseE2E*'
          -Dsurefire.failIfNoSpecifiedTests=false

      - name: Complexity budget check
        run: bash scripts/complexity-report.sh

      - name: Upload surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

      - name: Upload bootstrap jar
        uses: actions/upload-artifact@v4
        with:
          name: seahorse-agent-bootstrap-jar
          path: seahorse-agent-bootstrap/target/seahorse-agent-bootstrap-*-exec.jar
          if-no-files-found: error
          retention-days: 7

  # ==========================================================
  # 前端：typecheck / lint / test / build（全部为硬门禁）
  # ==========================================================
  frontend:
    name: Frontend · tsc / eslint / vitest / build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        id: typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        id: lint
        run: npm run lint

      - name: Unit tests
        id: test
        run: npm test

      - name: Production build (blocking)
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_SEAHORSE_PRODUCT_MODE: enterprise
          VITE_SEAHORSE_ENABLE_ADVANCED_ADMIN: 'true'

      - name: Quality summary
        if: always()
        run: |
          {
            echo "## Frontend 质量信号"
            echo "| 检查 | 结果 |"
            echo "|---|---|"
            echo "| Type check | ${{ steps.typecheck.outcome }} |"
            echo "| ESLint | ${{ steps.lint.outcome }} |"
            echo "| Vitest | ${{ steps.test.outcome }} |"
            echo "| Build | success |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================
  # Docker 镜像构建验证（仅 main push，验证 Dockerfile 未腐烂，不推镜像）
  # ==========================================================
  docker-build:
    name: Docker · backend image build check
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download bootstrap jar
        uses: actions/download-artifact@v4
        with:
          name: seahorse-agent-bootstrap-jar
          path: seahorse-agent-bootstrap/target/

      - name: Build backend image from prebuilt jar
        run: |
          docker build -t seahorse-agent-backend:ci -f - . <<'EOF'
          FROM eclipse-temurin:21-jre
          WORKDIR /app
          COPY seahorse-agent-bootstrap/target/seahorse-agent-bootstrap-*-exec.jar app.jar
          EXPOSE 9090
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF

  # ==========================================================
  # 汇总门禁：分支保护只需要 require 这一个 job
  # ==========================================================
  ci-gate:
    name: CI Gate
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          backend='${{ needs.backend.result }}'
          frontend='${{ needs.frontend.result }}'
          echo "backend=$backend frontend=$frontend"
          for r in "$backend" "$frontend"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::CI gate failed"
              exit 1
            fi
          done
          echo "CI gate passed"
