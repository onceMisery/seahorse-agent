# Optional sandbox runtime overlay.
#
# Usage:
#   docker compose -f docker-compose.full.yml -f docker-compose.sandbox.yml up -d --build backend
#
# Before using this file, set
# SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_WORKSPACE_MOUNT_SOURCE_ROOT to an
# absolute directory path visible to the Docker daemon. The same directory is
# mounted into the backend at WORKSPACE_ROOT, while sandbox child containers bind
# the daemon-visible MOUNT_SOURCE_ROOT/session path.

services:
  backend:
    environment:
      SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_NODE_ID: ${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_NODE_ID:-local-container-docker}
      SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_ADMISSION_ENABLED: ${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_ADMISSION_ENABLED:-true}
      SPRING_APPLICATION_JSON: >-
        {"seahorse-agent":{"adapters":{"sandbox":{"runtime":"container","container":{"engine":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_ENGINE:-docker}","python-image":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_PYTHON_IMAGE:-python:3.11-alpine}","browser-image":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_BROWSER_IMAGE:-seahorse-sandbox-browser:playwright-1.48.0}","office-conversion-image":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_OFFICE_CONVERSION_IMAGE:-seahorse-sandbox-office:libreoffice-7.4.7-bookworm}","browser-proxy-server":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_BROWSER_PROXY_SERVER:-}","browser-proxy-servers":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_BROWSER_PROXY_SERVERS:-}","browser-proxy-username":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_BROWSER_PROXY_USERNAME:-}","browser-proxy-password":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_BROWSER_PROXY_PASSWORD:-}","browser-private-network-allowed-hosts":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_BROWSER_PRIVATE_NETWORK_ALLOWED_HOSTS:-host.docker.internal,assets.docker.internal}","workspace-root":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_WORKSPACE_ROOT:-/var/lib/seahorse-sandbox}","workspace-mount-source-root":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_WORKSPACE_MOUNT_SOURCE_ROOT:?Set SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_WORKSPACE_MOUNT_SOURCE_ROOT to a Docker-daemon-visible absolute host path}","execution-timeout":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_EXECUTION_TIMEOUT:-30s}","stdout-limit-bytes":${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_STDOUT_LIMIT_BYTES:-16384},"stderr-limit-bytes":${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_STDERR_LIMIT_BYTES:-16384},"memory":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_MEMORY:-256m}","browser-memory":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_BROWSER_MEMORY:-768m}","cpus":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_CPUS:-1.0}","pids-limit":${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_PIDS_LIMIT:-128},"max-session-file-bytes":${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_MAX_SESSION_FILE_BYTES:-67108864},"external-virus-scanner-enabled":${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_EXTERNAL_VIRUS_SCANNER_ENABLED:-false},"external-virus-scanner-host":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_EXTERNAL_VIRUS_SCANNER_HOST:-clamav}","external-virus-scanner-port":${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_EXTERNAL_VIRUS_SCANNER_PORT:-3310},"external-virus-scanner-timeout":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_EXTERNAL_VIRUS_SCANNER_TIMEOUT:-10s}","orphan-workspace-min-age":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_ORPHAN_WORKSPACE_MIN_AGE:-5m}","max-active-sessions":${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_MAX_ACTIVE_SESSIONS:-0},"min-workspace-free-bytes":${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_MIN_WORKSPACE_FREE_BYTES:-0}}}}},"seahorse":{"agent":{"sandbox":{"network-policy":"${SEAHORSE_AGENT_SANDBOX_NETWORK_POLICY:-DENY_ALL}","allowlisted-hosts":"${SEAHORSE_AGENT_SANDBOX_ALLOWLISTED_HOSTS:-}","browser-private-network-allowed-hosts":"${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_BROWSER_PRIVATE_NETWORK_ALLOWED_HOSTS:-host.docker.internal,assets.docker.internal}"}}}}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_WORKSPACE_MOUNT_SOURCE_ROOT:?Set SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_WORKSPACE_MOUNT_SOURCE_ROOT to a Docker-daemon-visible absolute host path}
        target: ${SEAHORSE_AGENT_ADAPTERS_SANDBOX_CONTAINER_WORKSPACE_ROOT:-/var/lib/seahorse-sandbox}
  clamav:
    image: clamav/clamav:stable
    profiles: ["external-virus-scanner"]
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
